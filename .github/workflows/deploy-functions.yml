# Lægger serverfunktionerne (supabase/functions) op på Supabase.
# Kører automatisk, når funktionerne ændres, og kan startes manuelt under Actions.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Mangler SUPABASE_ACCESS_TOKEN eller SUPABASE_PROJECT_REF under Settings → Secrets and variables → Actions (README trin 5)."
            exit 1
          fi
          supabase functions deploy bank-connect --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy sync --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
